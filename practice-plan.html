<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="89ers Hub">
  <meta name="theme-color" content="#008348">
  <link rel="apple-touch-icon" href="/icon-192.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surrey 89ers — Practice Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#008348;--green-dark:#005c33;--green-deep:#003d22;--green-dim:rgba(0,131,72,0.15);
  --offwhite:#FAF9F6;--offwhite-mid:rgba(250,249,246,0.6);--muted:rgba(250,249,246,0.4);
  --card:#0f1f16;--card2:#152a1c;--border:rgba(0,131,72,0.2);--border-soft:rgba(250,249,246,0.07);
  --red:#e05555;--amber:#f59e0b;--blue:#60c8fa;
}
body{font-family:'Inter',sans-serif;background:#080f0b;color:var(--offwhite);min-height:100vh}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#002a18 0%,#003d22 50%,#001a0e 100%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:360px;text-align:center}
.login-logo{width:72px;height:72px;border-radius:50%;margin:0 auto 20px;display:block;object-fit:cover}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:32px;letter-spacing:1px;text-transform:uppercase}
.login-input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--offwhite);font-size:14px;font-family:'Inter',sans-serif;margin-bottom:12px;outline:none}
.login-input:focus{border-color:var(--green)}
.login-btn{width:100%;background:var(--green);border:none;border-radius:8px;padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.5px}
.login-btn:hover{background:var(--green-dark)}
.login-error{font-size:12px;color:var(--red);margin-top:8px;display:none}

/* APP */
#app{display:none}
.topbar{background:#080f0b;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{width:32px;height:32px;border-radius:50%;object-fit:cover}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.topbar-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{font-size:12px;font-weight:600;padding:8px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--border-soft);background:var(--card);color:var(--offwhite);transition:all 0.15s}
.btn:hover{background:var(--card2);border-color:var(--border)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}

.content{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 280px;gap:20px}

/* PRACTICE HEADER */
.practice-header{grid-column:1/-1;background:linear-gradient(135deg,var(--green-deep),var(--green-dark));border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start}
.practice-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
.practice-date{font-size:12px;color:var(--muted);margin-top:3px}
.practice-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meta-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:1px;text-transform:uppercase}
.pill-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,131,72,0.3)}
.pill-amber{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.2)}
.pill-blue{background:rgba(96,200,250,0.1);color:var(--blue);border:1px solid rgba(96,200,250,0.2)}
.pill-gray{background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid var(--border-soft)}
.pill-coach{background:rgba(96,200,250,0.08);color:var(--blue);border:1px solid rgba(96,200,250,0.15)}
.practice-num{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;color:rgba(0,131,72,0.25);line-height:1}
.practice-nav{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.p-nav-btn{background:rgba(0,0,0,0.2);border:1px solid var(--border-soft);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.p-nav-btn:hover{color:var(--offwhite);border-color:var(--border)}
.p-nav-current{font-size:11px;font-weight:700;color:var(--offwhite);padding:0 6px}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0}
.timeline-row{display:grid;grid-template-columns:54px 4px 1fr;gap:0 14px}
.t-time{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--green);text-align:right;padding-top:18px;white-space:nowrap}
.t-line{display:flex;flex-direction:column;align-items:center}
.t-dot{width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #080f0b;flex-shrink:0;margin-top:19px;box-shadow:0 0 7px rgba(0,131,72,0.5)}
.t-connector{flex:1;width:2px;background:linear-gradient(to bottom,var(--green),rgba(0,131,72,0.08));min-height:14px}
.timeline-row:last-child .t-connector{display:none}
.t-card{background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:13px 15px;margin:8px 0}
.t-card:hover{border-color:var(--border)}
.t-segment-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.t-segment{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.t-coach{font-size:10px;font-weight:600;color:var(--blue);background:rgba(96,200,250,0.08);padding:2px 8px;border-radius:4px;border:1px solid rgba(96,200,250,0.15);white-space:nowrap}
.t-title{font-size:14px;font-weight:700;color:var(--offwhite);margin-bottom:8px}
.duration-badge{float:right;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--green);opacity:0.45}
.t-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.t-tag{font-size:8px;font-weight:600;padding:1.5px 7px;border-radius:8px;letter-spacing:0.4px;opacity:0.7}
.tag-personnel{background:rgba(96,200,250,0.06);color:rgba(96,200,250,0.8);border:1px solid rgba(96,200,250,0.12)}
.tag-tactical{background:rgba(0,131,72,0.08);color:rgba(0,180,100,0.8);border:1px solid rgba(0,131,72,0.15)}
.tag-skill{background:rgba(245,158,11,0.06);color:rgba(245,158,11,0.8);border:1px solid rgba(245,158,11,0.12)}
.t-focus{font-size:12px;color:var(--offwhite);font-style:normal;padding:7px 10px;background:rgba(0,131,72,0.06);border-radius:5px;margin-top:6px}
.t-assistant{font-size:12px;color:var(--offwhite);font-style:italic;padding:7px 10px;background:rgba(96,200,250,0.06);border-radius:5px;margin-top:6px}
.t-focus-split{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,131,72,0.06);border-radius:5px;margin-top:6px;overflow:hidden}
.t-focus-col{font-size:12px;color:var(--offwhite);padding:7px 10px}
.t-focus-col+.t-focus-col{border-left:1px solid var(--border-soft)}
.note-line{line-height:1.6}
.note-line+.note-line{margin-top:4px}
.note-bullet{padding-left:2px}
.t-focus strong,.t-focus-col strong{font-weight:700;color:#fff}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:14px}
.side-card{background:var(--card);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
.side-header{padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.side-header::before{content:'';display:block;width:3px;height:12px;background:var(--green);border-radius:2px}
.side-body{padding:10px 14px}
.team-section{margin-bottom:10px}
.team-section:last-child{margin-bottom:0}
.team-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.team-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.team-col{border-right:1px solid var(--border-soft)}
.team-col:last-child,.team-col:nth-child(2n){border-right:none}
.team-col-inner{padding-right:0}
.team-sub-label{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.team-extra{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft)}

/* RPE / Phase pills */
.pill-rpe{background:rgba(224,85,85,0.08);color:#ff8a8a;border:1px solid rgba(224,85,85,0.18)}
.pill-phase{background:rgba(168,140,255,0.08);color:#c4b5fd;border:1px solid rgba(168,140,255,0.18)}

/* Synergy card */
.synergy-card{background:linear-gradient(135deg,rgba(0,131,72,0.08),var(--card));border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:flex;gap:13px;align-items:center;cursor:pointer;transition:border-color 0.15s;text-decoration:none;margin-top:8px}
.synergy-card:hover{border-color:var(--green)}
.synergy-icon{width:40px;height:40px;border-radius:8px;background:rgba(0,131,72,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#4ade80}
.synergy-info{flex:1;min-width:0}
.synergy-title{font-size:12.5px;font-weight:700;color:var(--offwhite);margin-bottom:2px}
.synergy-sub{font-size:10.5px;color:var(--muted)}
.synergy-arrow{font-size:14px;color:var(--green);flex-shrink:0}
.roster-player{display:flex;align-items:center;gap:7px;padding:3.5px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.roster-player:last-child{border-bottom:none}
.r-num{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;color:var(--green);width:16px;text-align:right;flex-shrink:0}
.r-name{font-size:11px;color:var(--offwhite);flex:1}
.r-status{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:0.5px}
.st-avail{background:rgba(74,222,128,0.1);color:#4ade80}
.st-unavail{background:rgba(224,85,85,0.1);color:var(--red)}
.unavail-row .r-name{opacity:0.6}

/* TIME TRACKING SUMMARY */
.tag-summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.tag-summary-row:last-child{border-bottom:none}
.ts-name{color:var(--offwhite)}
.ts-val{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--green)}
.ts-bar-bg{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:3px;overflow:hidden}
.ts-bar-fill{height:100%;background:var(--green);border-radius:2px}

/* PRINT STYLES */
/* PRINT — compact one-page layout */
.print-layout{display:none}
@media print {
  body{background:#fff !important;color:#111 !important;font-size:10px}
  #app > .topbar, #login-screen, .content{display:none !important}
  .print-layout{display:block !important}
  @page{margin:1cm;size:A4 portrait}

  .print-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
  .print-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#111}
  .print-date{font-size:10px;color:#555;margin-top:2px}
  .print-meta{display:flex;gap:6px;margin-top:5px}
  .print-pill{font-size:8px;font-weight:700;padding:2px 8px;border:1px solid #999;border-radius:3px;color:#333;text-transform:uppercase;letter-spacing:0.5px}
  .print-num{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:#ddd}

  .print-body{display:grid;grid-template-columns:1fr 150px;gap:12px}
  .print-timeline{display:flex;flex-direction:column;gap:4px}
  .print-row{display:grid;grid-template-columns:32px 1fr;gap:8px;border-bottom:1px solid #eee;padding:4px 0;page-break-inside:avoid}
  .print-time{font-size:9px;font-weight:700;color:#008348;text-align:right}
  .print-seg{font-size:7px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#999}
  .print-drill-title{font-size:10px;font-weight:700;color:#111;display:flex;justify-content:space-between;align-items:baseline}
  .print-coach{font-size:8px;color:#0066aa;font-weight:600}
  .print-tags{font-size:7px;color:#999;margin-top:1px}
  .print-focus{font-size:8.5px;color:#666;font-style:italic;margin-top:2px;line-height:1.3}
  .print-assistant{font-size:8.5px;color:#0066aa;font-style:italic;margin-top:2px;line-height:1.3}
  .print-focus-split{display:grid;grid-template-columns:1fr 1fr;margin-top:2px}
  .print-focus-col{font-size:8.5px;color:#666;line-height:1.3}
  .print-focus-col+.print-focus-col{border-left:1px solid #ddd;padding-left:6px;margin-left:6px}
  .print-focus .note-line,.print-focus-col .note-line{line-height:1.3}
  .print-focus .note-line+.note-line,.print-focus-col .note-line+.note-line{margin-top:0}
  .print-notes-line{font-size:8px;color:#555;margin-top:4px}

  .print-sidebar{border-left:1px solid #ddd;padding-left:10px}
  .print-side-title{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#008348;margin-bottom:4px;margin-top:8px}
  .print-side-title:first-child{margin-top:0}
  .print-roster-row{font-size:9px;color:#333;padding:1px 0}
  .print-unavail{font-size:8px;color:#c00;padding:1px 0}

  .print-footer{margin-top:10px;border-top:1px solid #ddd;padding-top:4px;font-size:7px;color:#aaa;text-align:right}
}
/* EDITING (shared by Schedule and Practice Plan) */
.ek-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:600;align-items:center;justify-content:center;padding:16px}
.ek-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:360px}
.ek-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.ek-sub{font-size:12px;color:var(--offwhite-mid);line-height:1.5;margin-bottom:14px}
.ek-input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--offwhite);font-size:15px;font-family:'Inter',sans-serif;outline:none;letter-spacing:1px}
.ek-input:focus{border-color:var(--green)}
.ek-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#06140c;border:1px solid var(--green);color:var(--offwhite);font-size:13px;font-weight:600;padding:11px 18px;border-radius:9px;z-index:700;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.toast.err{border-color:var(--red);color:#ffb3b3}
.f-row{margin-bottom:12px}
.f-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.f-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.f-lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f-in{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border-soft);border-radius:7px;padding:9px 11px;color:var(--offwhite);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;-webkit-appearance:none;appearance:none;min-height:38px}
.f-in:focus{border-color:var(--green)}
.f-in[type=date],.f-in[type=time]{color-scheme:dark}
textarea.f-in{resize:vertical;min-height:64px;line-height:1.45}
select.f-in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select.f-in option{background:#0f1f16;color:var(--offwhite)}
.f-hint{font-size:10.5px;color:var(--muted);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg-btn{font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid var(--border-soft);background:rgba(0,0,0,0.25);color:var(--offwhite-mid);cursor:pointer;font-family:'Inter',sans-serif;min-height:34px}
.seg-btn:hover{border-color:var(--border);color:var(--offwhite)}
.seg-btn.on{background:var(--green);border-color:var(--green);color:#fff}
.f-check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.f-check input{width:18px;height:18px;accent-color:var(--green)}
.btn-danger{background:transparent;border-color:rgba(224,85,85,0.35);color:#ff9c9c}
.btn-danger:hover{background:rgba(224,85,85,0.1);border-color:var(--red)}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.edit-banner{font-size:11.5px;color:var(--offwhite-mid);background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.6);margin-right:6px;vertical-align:1px}
@media (max-width:600px){.f-row2,.f-row3{grid-template-columns:1fr}}
/* PRACTICE EDITOR */
.topbar{height:auto;min-height:56px;flex-wrap:wrap;gap:8px;padding:8px 24px}
.topbar-actions{flex-wrap:wrap}
.live-note{font-size:11px;color:var(--offwhite-mid);white-space:nowrap}
#editor{display:none;max-width:1100px;margin:0 auto;padding:20px 24px 80px}
body.editing #editor{display:block}
body.editing .content,body.editing .practice-nav,body.editing #edit-btn,body.editing #new-btn,body.editing #print-btn{display:none !important}
.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--green-deep),var(--green-dark));border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:14px;position:sticky;top:60px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.ed-err{color:#ff9c9c;font-size:12.5px;margin:-4px 0 10px;min-height:0}
.ed-card{background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:16px;margin-bottom:14px}
.ed-sec{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.ed-sec::before{content:'';display:block;width:3px;height:12px;background:var(--green);border-radius:2px}
.ed-sec-aside{margin-left:auto;letter-spacing:.5px;text-transform:none;font-size:11.5px;color:var(--green);font-weight:700}
.ed-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ed-grid2 .ed-card{margin-bottom:0}
.ed-drill{background:var(--card2);border:1px solid var(--border-soft);border-radius:9px;padding:10px;margin-bottom:8px}
.ed-drill-top{display:flex;gap:10px;align-items:flex-start}
.ed-drill-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--green);width:22px;text-align:center;padding-top:9px;flex-shrink:0}
.ed-drill-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative}
.ed-drill-row1{display:grid;grid-template-columns:150px 1fr 70px 150px;gap:6px}
.ed-drill-tools{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.ed-icon{width:32px;height:32px;border-radius:6px;border:1px solid var(--border-soft);background:rgba(0,0,0,.25);color:var(--offwhite-mid);cursor:pointer;font-size:14px;line-height:1}
.ed-icon:hover{border-color:var(--border);color:var(--offwhite)}
.ed-icon[disabled]{opacity:.25;cursor:default}
.ed-icon-del:hover,.ed-icon.armed{background:var(--red);border-color:var(--red);color:#fff}
.ed-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ed-tag{font-size:10.5px;font-weight:600;padding:3px 4px 3px 9px;border-radius:10px;display:inline-flex;align-items:center;gap:3px}
.ed-tag button{background:none;border:none;color:inherit;opacity:.7;cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
.ed-tag-add{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:10px;border:1px dashed var(--border);background:none;color:var(--green);cursor:pointer}
.tag-pop{position:absolute;left:0;right:0;top:44px;z-index:30;background:#0b1a11;border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.tag-pop-cat{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:6px 0 5px}
.tag-pop-cat:first-child{margin-top:0}
.tag-pop-list{display:flex;flex-wrap:wrap;gap:5px}
.ed-tagopt{font-size:11px;font-weight:600;padding:6px 11px;border-radius:12px;cursor:pointer;opacity:.55;font-family:'Inter',sans-serif}
.ed-tagopt.on{opacity:1;box-shadow:0 0 0 1.5px currentColor inset}
.ed-av-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ed-av-row:last-child{border-bottom:none}
.ed-av-name{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-av-row .seg{flex-wrap:nowrap;gap:3px}
.ed-av-row .seg-btn{padding:5px 8px;font-size:11px;min-height:30px}
.ed-av-row .seg-btn.on[data-v="X"],.ed-av-row .seg-btn.on[data-v="I"],.ed-av-row .seg-btn.on[data-v="S"]{background:var(--red);border-color:var(--red)}
.ed-av-row .seg-btn.on[data-v="A"]{background:var(--amber);border-color:var(--amber);color:#111}
.ed-team{margin-bottom:14px}
.ed-team-count{color:var(--green);letter-spacing:0;margin-left:4px}
.ed-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ed-chip{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:7px;border:1px solid var(--border-soft);background:rgba(0,0,0,.25);color:var(--offwhite-mid);cursor:pointer;font-family:'Inter',sans-serif;min-height:32px}
.ed-chip.on{background:var(--green);border-color:var(--green);color:#fff}
.ed-chip.taken{opacity:.4}
.ed-chip.out{text-decoration:line-through;opacity:.3}
.ed-chip.out.on{opacity:1;background:var(--red);border-color:var(--red)}
@media (max-width:900px){
  .ed-drill-row1{grid-template-columns:1fr 70px}
  .ed-drill-row1 .dr-seg{grid-column:1/-1}
  .ed-drill-row1 .dr-coach{grid-column:1/-1}
  .ed-grid2{grid-template-columns:1fr}
  .ed-head{top:0;position:relative}
}
@media print{#editor{display:none !important}}
.dr-assist{min-height:38px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" id="login-logo" alt="Surrey 89ers">
    <div class="login-title">Surrey 89ers</div>
    <div class="login-sub">Coaches Hub · 2026-27</div>
    <input class="login-input" type="password" id="login-pass" placeholder="Password" autocomplete="off">
    <button class="login-btn" onclick="tryLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" id="topbar-logo" alt="89ers">
      <div><div class="topbar-title">Surrey 89ers</div><div class="topbar-sub">Practice Plan · 2026-27</div></div>
    </div>
    <div class="topbar-actions">
      <a class="btn" href="index.html">← Coaches Hub</a>
      <div class="practice-nav">
        <div class="p-nav-btn" onclick="changePractice(-1)">← Prev</div>
        <div class="p-nav-current" id="practice-nav-label"></div>
        <div class="p-nav-btn" onclick="changePractice(1)">Next →</div>
      </div>
      <span class="live-note" id="live-note"></span>
      <button class="btn" id="edit-btn" onclick="startEdit()" disabled>✎ Edit</button>
      <button class="btn" id="new-btn" onclick="startNew()" disabled>+ New practice</button>
      <button class="btn btn-primary" id="print-btn" onclick="window.print()">🖨 Print</button>
    </div>
  </div>

  <div class="content">
    <div class="practice-header">
      <div>
        <div class="practice-title" id="p-title">Practice</div>
        <div class="practice-date" id="p-date"></div>
        <div class="practice-meta" id="p-meta"></div>
      </div>
      <div class="practice-num" id="p-num"></div>
    </div>

    <div id="synergy-card-wrap" style="grid-column:1/-1"></div>

    <div class="print-only" style="grid-column:1/-1;margin:-8px 0 8px;font-size:10px;color:#999;text-align:right">
      Surrey 89ers Basketball — Confidential — Printed for coaching staff use only
    </div>

    <div class="timeline" id="practice-timeline"></div>

    <div class="sidebar">
      <div class="side-card" id="side-notes-card" style="display:none">
        <div class="side-header">Notes</div>
        <div class="side-body" id="side-notes-body" style="font-size:12px;line-height:1.5;color:var(--offwhite)"></div>
      </div>
      <div class="side-card">
        <div class="side-header">Roster — Available</div>
        <div class="side-body">
          <div class="team-section">
            <div class="team-label">5v5 Teams</div>
            <div id="roster-5v5"></div>
          </div>
          <div class="team-section">
            <div class="team-label">4v4 Teams</div>
            <div id="roster-4v4"></div>
          </div>
        </div>
      </div>
      <div class="side-card">
        <div class="side-header">Unavailable</div>
        <div class="side-body" id="roster-unavailable"></div>
      </div>
      <div class="side-card">
        <div class="side-header">Time Tracking — Season</div>
        <div class="side-body" id="tag-summary"></div>
      </div>
    </div>
  </div>

  <div id="editor"></div>

    <!-- PRINT-ONLY LAYOUT -->
    <div class="print-layout" id="print-layout"></div>
</div>

/* ============================================================
   EDITING — shared by the Schedule and Practice Plan pages
   Writes go to the Player Portal Endpoint (HubEdit.gs), which needs the
   hub edit code. The code is asked for once per device and kept in this
   browser only; it is never in the page source.
   ============================================================ */
const HUB_ENDPOINT = "https://script.google.com/macros/s/AKfycbx-xVqT4EUY_ygD-AvzmfXE4EMcya1qlrsFtnKY7WzMaDTj-w9dwrH2Pbuvjbd6Mu0cKA/exec";
const EDIT_KEY_STORE = "89ers_edit_key";

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function editKey(){try{return localStorage.getItem(EDIT_KEY_STORE)||"";}catch(e){return "";}}
function setEditKey(k){try{k?localStorage.setItem(EDIT_KEY_STORE,k):localStorage.removeItem(EDIT_KEY_STORE);}catch(e){}}

async function hubCall(body){
  const res=await fetch(HUB_ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow",body:JSON.stringify(body)});
  if(!res.ok) throw new Error("The endpoint replied "+res.status);
  return res.json();
}
/* A write: attaches the edit code, asks for it if missing or wrong */
async function hubWrite(body){
  for(let attempt=0;attempt<3;attempt++){
    let key=editKey();
    if(!key){key=await askEditKey(attempt>0);if(!key) throw new Error("cancelled");}
    const out=await hubCall(Object.assign({},body,{key}));
    if(out.error==="bad_key"){setEditKey("");continue;}
    if(out.error==="no_key_set") throw new Error("Editing isn't switched on yet — run hubEditSetup() in Apps Script.");
    return out;
  }
  throw new Error("cancelled");
}

/* Edit-code dialog */
function askEditKey(wasWrong){
  return new Promise(resolve=>{
    let box=document.getElementById("ek-modal");
    if(!box){
      box=document.createElement("div");box.id="ek-modal";box.className="ek-modal";
      box.innerHTML=`<div class="ek-box"><div class="ek-title">Edit code</div>
        <div class="ek-sub" id="ek-sub"></div>
        <input class="ek-input" id="ek-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx">
        <div class="ek-btns"><button class="btn" id="ek-cancel">Cancel</button><button class="btn btn-primary" id="ek-ok">Unlock editing</button></div></div>`;
      document.body.appendChild(box);
    }
    document.getElementById("ek-sub").innerHTML=wasWrong
      ?'<span style="color:var(--red)">That code didn\'t work.</span> Try again.'
      :"Saving changes to the Google Sheet needs the coaches' edit code. You'll only be asked once on this device.";
    const inp=document.getElementById("ek-input");inp.value="";
    box.style.display="flex";setTimeout(()=>inp.focus(),50);
    const done=v=>{box.style.display="none";ok.onclick=cancel.onclick=inp.onkeydown=null;if(v)setEditKey(v);resolve(v);};
    const ok=document.getElementById("ek-ok"),cancel=document.getElementById("ek-cancel");
    ok.onclick=()=>done(inp.value.trim());
    cancel.onclick=()=>done("");
    inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value.trim());if(e.key==="Escape")done("");};
  });
}

function toast(msg,kind){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.className="toast "+(kind||"");t.textContent=msg;t.style.opacity="1";
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity="0";},kind==="err"?6000:3200);
}

/* Segmented control: one tap picks a value; tapping the picked one clears it if allowClear */
function segHtml(name,options,value,allowClear){
  return `<div class="seg" data-seg="${name}" data-clear="${allowClear?1:0}">`+options.map(o=>{
    const v=typeof o==="string"?o:o.v, l=typeof o==="string"?o:o.l;
    return `<button type="button" class="seg-btn${String(value)===String(v)?" on":""}" data-v="${esc(v)}">${esc(l)}</button>`;
  }).join("")+`</div>`;
}
function segValue(root,name){const b=root.querySelector(`[data-seg="${name}"] .seg-btn.on`);return b?b.dataset.v:"";}
document.addEventListener("click",e=>{
  const b=e.target.closest(".seg-btn");if(!b)return;
  const seg=b.parentElement;
  const was=b.classList.contains("on");
  seg.querySelectorAll(".seg-btn").forEach(x=>x.classList.remove("on"));
  if(!(was&&seg.dataset.clear==="1"))b.classList.add("on");
  seg.dispatchEvent(new CustomEvent("segchange",{bubbles:true,detail:{name:seg.dataset.seg,value:segValue(seg.parentElement,seg.dataset.seg)}}));
});

/* "Tap again to confirm" for destructive buttons, instead of a browser dialog */
function armConfirm(btn,label){
  if(btn.dataset.armed==="1"){btn.dataset.armed="";return true;}
  btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label||"Tap again to confirm";btn.classList.add("armed");
  setTimeout(()=>{if(btn.dataset.armed==="1"){btn.dataset.armed="";btn.textContent=old;btn.classList.remove("armed");}},4000);
  return false;
}

function clean(s){return(s||"").replace(/^"|"$/g,"").trim();}
function nl2br(s){return esc(s||"").replace(/\n/g,"<br>");}
function escHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function formatNote(text){
  if(!text) return "";
  return text.split("\n").map(line=>{
    let raw=line;
    let indent=0;
    while(raw[0]==="\t"){indent++;raw=raw.slice(1);}
    const leadSpaces=(raw.match(/^ */)||[""])[0].length;
    indent+=Math.floor(leadSpaces/2);
    raw=raw.slice(leadSpaces);
    const bulletMatch=raw.match(/^[-•]\s*(.*)$/);
    const isBullet=!!bulletMatch;
    let content=isBullet?bulletMatch[1]:raw;
    content=escHtml(content);
    content=content.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    if(content.trim()===""){
      return `<div class="note-line">&nbsp;</div>`;
    }
    const style=indent?` style="margin-left:${indent*14}px"`:"";
    if(isBullet){
      return `<div class="note-line note-bullet"${style}>• ${content}</div>`;
    }
    return `<div class="note-line"${style}>${content}</div>`;
  }).join("");
}
function splitFocusNote(note){
  if(!note) return null;
  const lines=note.split("\n");
  const idx=lines.findIndex(l=>{const s=l.trim();return s==="|"||/^-{2,}$/.test(s);});
  if(idx===-1) return null;
  return {left:lines.slice(0,idx).join("\n"), right:lines.slice(idx+1).join("\n")};
}
function focusHtml(note){
  const split=splitFocusNote(note);
  if(!split) return `<div class="t-focus">${formatNote(note)}</div>`;
  return `<div class="t-focus-split"><div class="t-focus-col">${formatNote(split.left)}</div><div class="t-focus-col">${formatNote(split.right)}</div></div>`;
}
function printFocusHtml(note){
  const split=splitFocusNote(note);
  if(!split) return `<div class="print-focus">${formatNote(note)}</div>`;
  return `<div class="print-focus-split"><div class="print-focus-col">${formatNote(split.left)}</div><div class="print-focus-col">${formatNote(split.right)}</div></div>`;
}
function parseCSV(text){
  // Full CSV parser handling quoted fields with embedded newlines and commas
  const rows=[];
  let row=[],cur="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(inQ){
      if(ch==='"' && next==='"'){cur+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{cur+=ch;}
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===","){row.push(cur);cur="";}
      else if(ch==="\r"){}
      else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else{cur+=ch;}
    }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||r[0]!=="").map(r=>r.map(c=>c.trim()));
}

async function fetchCSV(sheetName){

  }catch(e){console.error("Failed to load "+sheetName,e);return [];}

/* dd/mm/yyyy (published CSV) or yyyy-mm-dd (live) -> yyyy-mm-dd */
function toIso(s){
  s=String(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return s;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m)return (m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return "";
}
function isoDate(s){const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function niceDate(iso){
  const d=isoDate(iso);if(!d)return iso||"";
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getFullYear();
}
function rowsToObjects(rows,keep){
  if(!rows.length)return [];
  const h=rows[0].map(x=>x.trim());
  return rows.slice(1).filter(keep||(r=>r[0])).map(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=r[i]||"";});return o;});
}

async function loadAll(){
  /* 1. Published CSVs — quick to show, a few minutes behind the sheet */
  const [practices, drills, tags, roster, library] = await Promise.all([
    fetchCSV("Practices"),
    fetchCSV("Practice Drills"),
    fetchCSV("Tags"),
    fetchCSV("Roster Availability"),
    SHEET_URLS["Drill Library"]?fetchCSV("Drill Library"):Promise.resolve([])
  ]);
  if(!LIVE){
    PRACTICES=rowsToObjects(practices).map(p=>Object.assign(p,{date:toIso(p.date)||p.date}));
    DRILLS=rowsToObjects(drills);
    TAGS=rowsToObjects(tags,r=>r[0]&&r[1]);
    LIBRARY=rowsToObjects(library,r=>r[1]).map(d=>({id:d.drill_id||"",name:d.drill_name||"",section:d.category_section||"",tags:d["tags (comma separated)"]||"",minutes:d.typical_minutes||""}));
    // Roster (wide format: player | 1 | 2 | ...)
    const rHeader=roster[0]||[];
    PRACTICE_COLS=rHeader.slice(1);
    const stop=roster.findIndex(r=>/^(TOTAL|KEY)$/i.test(r[0]||""));
    ROSTER=roster.slice(1,stop>0?stop:undefined).filter(r=>r[0]&&!["O","X","I","A","S"].includes(r[0].toUpperCase())).map(r=>{
      const o={player:r[0],statuses:{}};
      rHeader.slice(1).forEach((col,i)=>{o.statuses[col]=(r[i+1]||"").toUpperCase();});
      return o;
    });
    pickStartPractice();
    renderPractice();
  }
  /* 2. Live data from the endpoint — exact, and needed before anything can be edited */
  try{
    const out=await hubCall({type:"hub_practice_get"});
    if(!out.ok||!Array.isArray(out.practices))throw new Error(out.error||"no data");
    const keep=PRACTICES[currentIdx]?PRACTICES[currentIdx].practice_num:null;
    applyLive(out);
    if(keep&&!EDIT){const i=PRACTICES.findIndex(p=>p.practice_num===keep);if(i>=0)currentIdx=i;else pickStartPractice();}
    else if(!keep)pickStartPractice();
    if(!EDIT)renderPractice();
  }catch(err){
    console.warn("Live practice data unavailable:",err);
    setLiveStatus(false);
  }
}
function applyLive(out){
  LIVE=true;
  const byNum=(a,b)=>(+a.practice_num||0)-(+b.practice_num||0);
  PRACTICES=out.practices.map(p=>{const o=Object.assign({},p);delete o._row;return o;}).sort(byNum);
  DRILLS=out.drills.map(d=>{const o=Object.assign({},d);delete o._row;return o;});
  TAGS=out.tags||[];
  LIBRARY=out.library||[];
  PRACTICE_COLS=Object.keys(out.roster.statuses||{});
  ROSTER=(out.roster.players||[]).map(name=>{
    const o={player:name,statuses:{}};
    PRACTICE_COLS.forEach(n=>{o.statuses[n]=(out.roster.statuses[n]||{})[name]||"";});
    return o;
  });
  setLiveStatus(true);
}
function setLiveStatus(live){
  document.getElementById("edit-btn").disabled=!live;
  document.getElementById("new-btn").disabled=!live;
  document.getElementById("live-note").innerHTML=live
    ?'<span class="live-dot"></span>Live from the sheet'

}

/* ?p=34 opens that practice; otherwise today's, else the next one, else the last */
function pickStartPractice(){
  const want=new URLSearchParams(location.search).get("p");
  let i=want?PRACTICES.findIndex(p=>String(p.practice_num)===String(want)):-1;
  if(i<0){
    const t=todayIso();
    i=PRACTICES.findIndex(p=>p.date===t);
    if(i<0){
      let best=-1;
      PRACTICES.forEach((p,k)=>{if(p.date>t&&(best<0||p.date<PRACTICES[best].date))best=k;});
      i=best;
    }
  }
  currentIdx=i>=0?i:PRACTICES.length-1;
}

function tagClass(tagName){
  const t=TAGS.find(t=>t.tag===tagName);
  const cat=t?t.category:"";
  if(cat==="Personnel")return "tag-personnel";
  if(cat==="Tactical")return "tag-tactical";
  if(cat==="Skill")return "tag-skill";
  return "tag-tactical";
}

function getTeamLists(p, prefix, maxTeams){
  const suffixSets={
    "team_5v5": ["Black","White","c","d"],
    "team_4v4": ["a","b","c","d"]
  };
  const suffixes=(suffixSets[prefix]||["a","b","c","d"]).slice(0,maxTeams);
  const teams=[];
  for(const suf of suffixes){
    const key=prefix+"_"+suf;
    const names=(p[key]||"").split(",").map(n=>n.trim()).filter(n=>n);
    if(names.length) teams.push({label:suf.toUpperCase(), players:names});
  }
  return teams;
}

function renderTeamGroup(containerId, teams, emptyMsg, labelOverrides){
  const el=document.getElementById(containerId);
  if(!teams.length){
    el.innerHTML=`<div style="font-size:10px;color:var(--muted)">${emptyMsg}</div>`;
    return;
  }
  function teamHtml(team, idx){
    const label = (labelOverrides && labelOverrides[idx]) ? labelOverrides[idx] : ("Team "+team.label);
    return `<div class="team-col-inner">
      <div class="team-sub-label">${esc(label)}</div>
      ${team.players.map((name,i)=>`
        <div class="roster-player"><span class="r-num">${i+1}</span><span class="r-name">${esc(name)}</span></div>
      `).join("")}
    </div>`;
  }
  const firstTwo = teams.slice(0,2);
  const rest = teams.slice(2);
  let html = `<div class="team-grid-2col">`;
  html += firstTwo.map((t,i)=>`<div class="team-col">${teamHtml(t,i)}</div>`).join("");
  if(rest.length){
    html += `<div class="team-extra"><div class="team-grid-2col">`;
    html += rest.map((t,i)=>`<div class="team-col">${teamHtml(t,i+2)}</div>`).join("");
    html += `</div></div>`;
  }
  html += `</div>`;
  el.innerHTML=html;
}

function renderTagSummary(){
  // Sum minutes per tag across ALL practices — manual tags plus each drill's library_tags
  const tagMinutes={};
  DRILLS.forEach(d=>{
    const mins=parseInt(d.minutes)||0;
    const manualTags=(d["tags (comma separated)"]||"").split(",").map(t=>t.trim()).filter(t=>t);
    const libTags=(d["library_tags"]||"").split(",").map(t=>t.trim()).filter(t=>t);
    const tags=[...new Set([...manualTags, ...libTags])];
    tags.forEach(t=>{tagMinutes[t]=(tagMinutes[t]||0)+mins;});
  });
  const sorted=Object.entries(tagMinutes).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted.length?sorted[0][1]:1;
  document.getElementById("tag-summary").innerHTML=sorted.length?sorted.map(([tag,mins])=>`
    <div class="tag-summary-row" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between">
        <span class="ts-name">${esc(tag)}</span>

      </div>
      <div class="ts-bar-bg"><div class="ts-bar-fill" style="width:${(mins/max)*100}%"></div></div>
    </div>
  `).join(""):'<div style="font-size:10px;color:var(--muted)">No tagged drills yet</div>';
}

function shortName(full){return String(full||"").trim().split(/\s+/)[0].replace(/['’]/g,"");}
function listSplit(s){return String(s||"").split(",").map(x=>x.trim()).filter(Boolean);}
function uniq(a){return [...new Set(a.filter(Boolean))];}
function teamKeys(){
  const keys=uniq(PRACTICES.flatMap(p=>Object.keys(p).filter(k=>/^team_/.test(k))));
  const order=Object.keys(TEAM_LABELS);
  return (keys.length?keys:order.slice(0,2)).sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
}
function weekFor(iso){
  const first=PRACTICES.find(p=>p.date&&String(p.week)==="1");
  const d=isoDate(iso),f=first&&isoDate(first.date);
  if(!d||!f)return "";
  const mon=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()-((x.getDay()+6)%7));
  return String(Math.round((mon(d)-mon(f))/(7*86400000))+1);
}
function blankDrill(){return {segment:"",drill:"",minutes:"",leading_coach:"Head Coach",tags:"",focus_note:"",assistant_emphasis:""};}
function drillFromRow(d){return {segment:d.segment||"",drill:d.drill_id_or_name||"",minutes:d.minutes||"",leading_coach:d.leading_coach||"",tags:d["tags (comma separated)"]||"",focus_note:d.focus_note||"",assistant_emphasis:d.assistant_emphasis||""};}

/* New practice: next number, next scheduled practice date, copied from the latest plan */
async function startNew(){
  if(!LIVE)return;
  const latest=PRACTICES.reduce((a,b)=>(+b.practice_num>+(a&&a.practice_num||0)?b:a),null);
  const num=String((latest?+latest.practice_num:0)+1);
  let date="";
  try{
    const rows=parseCSV(await (await fetch(SCHEDULE_CSV)).text());
    const h=rows[0].map(x=>x.trim()),iD=h.indexOf("date"),iC=h.indexOf("category");
    const floor=latest&&latest.date>todayIso()?latest.date:"";
    const cands=rows.slice(1).filter(r=>r[iC]==="Practice").map(r=>toIso(r[iD])).filter(d=>d&&d>=todayIso()&&d>floor).sort();
    date=cands[0]||"";
  }catch(e){}
  if(!date)date=todayIso();
  EDIT={isNew:true,original:null,copyFrom:latest?latest.practice_num:"",p:{practice_num:num,date,week:weekFor(date),leading_coach:"Head Coach"},drills:[],avail:{}};
  applyCopy(EDIT.copyFrom);
  renderEditor();
}
function applyCopy(fromNum){
  const src=PRACTICES.find(p=>String(p.practice_num)===String(fromNum));
  const keepNum=EDIT.p.practice_num,keepDate=EDIT.p.date,keepWeek=EDIT.p.week;
  if(src){
    EDIT.p=Object.assign({},src,{practice_num:keepNum,date:keepDate,week:keepWeek,notes:"",synergy_url:""});
    EDIT.drills=drillsFor(src.practice_num).map(drillFromRow);
    EDIT.avail={};ROSTER.forEach(r=>EDIT.avail[r.player]=(r.statuses[src.practice_num]||"O").toUpperCase()||"O");
  }else{
    EDIT.p={practice_num:keepNum,date:keepDate,week:keepWeek,leading_coach:"Head Coach"};
    EDIT.drills=[blankDrill()];
    EDIT.avail={};ROSTER.forEach(r=>EDIT.avail[r.player]="O");
  }
  EDIT.copyFrom=fromNum;
}

function optionsWith(base,values){return uniq(base.concat(values));}
function renderEditor(){
  document.body.classList.add("editing");
  const p=EDIT.p;
  const gd=optionsWith(GD_OPTIONS,PRACTICES.map(x=>x.gd_status).filter(v=>v&&v!=="Workdout"));
  const coaches=optionsWith(COACH_OPTIONS,[]);
  const phases=PHASE_OPTIONS;
  const phaseVal=PHASE_OPTIONS.find(x=>x.toLowerCase()===String(p.phase_of_season||"").toLowerCase())||p.phase_of_season||"";
  const copyOpts=PRACTICES.slice().reverse().map(x=>`<option value="${esc(x.practice_num)}"${String(x.practice_num)===String(EDIT.copyFrom)?" selected":""}>#${esc(x.practice_num)} · ${esc(niceDate(x.date))}</option>`).join("");
  document.getElementById("editor").innerHTML=`
  <div class="ed-head">
    <div>
      <div class="practice-title">${EDIT.isNew?"New practice":"Edit practice #"+esc(p.practice_num)}</div>
      <div class="practice-date" id="ed-total"></div>
    </div>
    <div class="ed-actions">
      ${EDIT.isNew?"":`<button class="btn btn-danger" id="ed-del" onclick="deletePractice(this)">Delete practice</button>`}
      <button class="btn" onclick="cancelEdit()">Cancel</button>
      <button class="btn btn-primary" id="ed-save" onclick="savePractice()">${EDIT.isNew?"Create practice":"Save changes"}</button>
    </div>
  </div>
  <div id="ed-err" class="ed-err"></div>
  ${EDIT.isNew?`<div class="ed-card"><div class="f-row" style="margin:0"><label class="f-lbl" for="ed-copy">Start from</label>
    <select class="f-in" id="ed-copy" onchange="captureEditor();applyCopy(this.value);renderEditor()"><option value="">A blank plan</option>${copyOpts}</select>
    <div class="f-hint">Copies that practice's drills, teams and availability — change anything below.</div></div></div>`:""}
  <div class="ed-card">
    <div class="ed-sec">Session</div>
    <div class="f-row3">
      <div><label class="f-lbl" for="ed-num">Practice #</label><input class="f-in" id="ed-num" type="number" inputmode="numeric" value="${esc(p.practice_num)}" ${EDIT.isNew?"":"disabled"}></div>
      <div><label class="f-lbl" for="ed-date">Date</label><input class="f-in" id="ed-date" type="date" value="${esc(p.date)}" onchange="document.getElementById('ed-week').value=weekFor(this.value)||document.getElementById('ed-week').value"></div>
      <div><label class="f-lbl" for="ed-week">Week</label><input class="f-in" id="ed-week" type="number" inputmode="numeric" value="${esc(p.week)}"></div>
    </div>
    <div class="f-row"><span class="f-lbl">Game-day status</span>${segHtml("gd_status",gd,p.gd_status,true)}</div>
    <div class="f-row2">
      <div><span class="f-lbl">Load</span>${segHtml("load",["Low","Medium","High"],p.load,true)}</div>
      <div><span class="f-lbl">Phase</span>${segHtml("phase_of_season",phases.concat(phases.includes(phaseVal)||!phaseVal?[]:[phaseVal]),phaseVal,true)}</div>
    </div>
    <div class="f-row3">
      <div><label class="f-lbl" for="ed-coach">Leading coach</label><select class="f-in" id="ed-coach">${optionsWith(coaches,[p.leading_coach]).map(c=>`<option${c===p.leading_coach?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div><label class="f-lbl" for="ed-rpe">RPE target</label><input class="f-in" id="ed-rpe" type="number" inputmode="decimal" min="0" max="10" step="0.5" value="${esc(p.rpe_target)}" placeholder="optional"></div>
      <div><label class="f-lbl" for="ed-syn">Synergy link</label><input class="f-in" id="ed-syn" type="url" value="${esc(p.synergy_url)}" placeholder="https://…"></div>
    </div>
    <div class="f-row" style="margin:0"><label class="f-lbl" for="ed-notes">Notes</label><textarea class="f-in" id="ed-notes" rows="2">${esc(p.notes)}</textarea></div>
  </div>

  <div class="ed-card">
    <div class="ed-sec">Drills <span id="ed-mins" class="ed-sec-aside"></span></div>
    <div id="ed-drills"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="captureEditor();EDIT.drills.push(blankDrill());renderDrills();focusDrill(EDIT.drills.length-1)">+ Add drill</button>
  </div>

  <div class="ed-grid2">
    <div class="ed-card">
      <div class="ed-sec">Availability</div>
      <div id="ed-avail"></div>
    </div>
    <div class="ed-card">
      <div class="ed-sec">Teams</div>
      <div class="f-hint" style="margin:-4px 0 10px">Tap names to add or remove. Greyed names are unavailable.</div>
      <div id="ed-teams"></div>
    </div>
  </div>
  <datalist id="dl-segments">${optionsWith(SEGMENT_OPTIONS,[]).map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
  <datalist id="dl-drills">${LIBRARY.map(d=>`<option value="${esc(d.name)}">${esc(d.section||"")}</option>`).join("")}</datalist>`;
  renderDrills();renderAvail();renderTeams();
  window.scrollTo(0,0);
}

function renderDrills(){
  const coaches=optionsWith(COACH_OPTIONS,EDIT.drills.map(d=>d.leading_coach));
  document.getElementById("ed-drills").innerHTML=EDIT.drills.map((d,i)=>{
    const tags=listSplit(d.tags);
    const inLib=!d.drill||LIBRARY.some(x=>x.name===d.drill);
    return `<div class="ed-drill" data-i="${i}">
      <div class="ed-drill-top">
        <div class="ed-drill-num">${i+1}</div>
        <div class="ed-drill-fields">
          <div class="ed-drill-row1">
            <input class="f-in dr-seg" list="dl-segments" value="${esc(d.segment)}" placeholder="Segment" aria-label="Segment">
            <input class="f-in dr-drill" list="dl-drills" value="${esc(d.drill)}" placeholder="Drill — type to search the library" aria-label="Drill" onchange="drillPicked(${i},this)">
            <input class="f-in dr-min" type="number" inputmode="numeric" min="0" value="${esc(d.minutes)}" placeholder="min" aria-label="Minutes" oninput="updateTotal()">
            <select class="f-in dr-coach" aria-label="Leading coach"><option value=""${d.leading_coach?"":" selected"}>Coach…</option>${coaches.map(c=>`<option${c===d.leading_coach?" selected":""}>${esc(c)}</option>`).join("")}</select>
          </div>
          ${inLib?"":`<div class="f-hint" style="color:var(--amber)">Not in the Drill Library — it'll save, but won't pick up library tags or loading.</div>`}
          <div class="ed-tags">
            ${tags.map(t=>`<span class="ed-tag ${tagClass(t)}" data-t="${esc(t)}">${esc(t)}<button type="button" onclick="toggleTag(${i},this.parentElement.dataset.t)" aria-label="Remove tag">×</button></span>`).join("")}
            <button type="button" class="ed-tag-add" onclick="openTagPicker(${i},this)">+ tag</button>
          </div>
          <textarea class="f-in dr-focus" rows="${Math.min(8,Math.max(2,(d.focus_note||"").split("\n").length))}" placeholder="Focus note (- for bullets, **bold**, a line with | splits into two columns)">${esc(d.focus_note)}</textarea>
          <textarea class="f-in dr-assist" rows="1" placeholder="Assistant emphasis (optional)">${esc(d.assistant_emphasis)}</textarea>
        </div>
        <div class="ed-drill-tools">
          <button type="button" class="ed-icon" title="Move up" onclick="moveDrill(${i},-1)" ${i===0?"disabled":""}>↑</button>
          <button type="button" class="ed-icon" title="Move down" onclick="moveDrill(${i},1)" ${i===EDIT.drills.length-1?"disabled":""}>↓</button>
          <button type="button" class="ed-icon" title="Duplicate" onclick="dupDrill(${i})">⧉</button>
          <button type="button" class="ed-icon ed-icon-del" title="Remove" onclick="removeDrill(${i},this)">✕</button>
        </div>
      </div>
    </div>`;
  }).join("")||'<div class="f-hint" style="padding:8px 0">No drills yet.</div>';
  updateTotal();
}
function focusDrill(i){const el=document.querySelector(`.ed-drill[data-i="${i}"] .dr-seg`);if(el){el.focus();el.scrollIntoView({block:"center",behavior:"smooth"});}}
function updateTotal(){
  const t=[...document.querySelectorAll(".dr-min")].reduce((s,x)=>s+(parseInt(x.value)||0),0);
  const n=document.querySelectorAll(".ed-drill").length;
  document.getElementById("ed-mins").textContent=n?`${n} drill${n!==1?"s":""} · ${t} min`:"";
  document.getElementById("ed-total").textContent=`${t} minutes planned`;
}
/* Read every drill input back into EDIT before re-rendering */
function captureEditor(){
  if(!EDIT)return;
  const f=id=>document.getElementById(id);
  if(f("ed-date")){
    const root=f("editor");
    Object.assign(EDIT.p,{
      practice_num:f("ed-num").value.trim(), date:f("ed-date").value, week:f("ed-week").value.trim(),
      gd_status:segValue(root,"gd_status"), load:segValue(root,"load"), phase_of_season:segValue(root,"phase_of_season"),
      leading_coach:f("ed-coach").value, rpe_target:f("ed-rpe").value.trim(), synergy_url:f("ed-syn").value.trim(), notes:f("ed-notes").value
    });
    document.querySelectorAll(".ed-team-in").forEach(x=>EDIT.p[x.dataset.k]=x.value);
  }
  document.querySelectorAll(".ed-drill").forEach(el=>{
    const d=EDIT.drills[+el.dataset.i];if(!d)return;
    d.segment=el.querySelector(".dr-seg").value.trim();
    d.drill=el.querySelector(".dr-drill").value.trim();
    d.minutes=el.querySelector(".dr-min").value.trim();
    d.leading_coach=el.querySelector(".dr-coach").value;
    d.focus_note=el.querySelector(".dr-focus").value.replace(/\s+$/,"");
    d.assistant_emphasis=el.querySelector(".dr-assist").value.trim();
  });
}
function drillPicked(i,inp){
  captureEditor();
  const lib=LIBRARY.find(x=>x.name===inp.value.trim());
  const d=EDIT.drills[i];
  if(lib){
    if(!d.minutes&&lib.minutes)d.minutes=String(parseInt(lib.minutes)||"");
    if(!d.segment&&lib.section)d.segment=lib.section;
  }
  renderDrills();
}
function moveDrill(i,dir){captureEditor();const j=i+dir;if(j<0||j>=EDIT.drills.length)return;[EDIT.drills[i],EDIT.drills[j]]=[EDIT.drills[j],EDIT.drills[i]];renderDrills();}
function dupDrill(i){captureEditor();EDIT.drills.splice(i+1,0,Object.assign({},EDIT.drills[i]));renderDrills();}
function removeDrill(i,btn){
  if(!armConfirm(btn,"✕?"))return;
  captureEditor();EDIT.drills.splice(i,1);renderDrills();
}
function toggleTag(i,tag){
  captureEditor();
  const d=EDIT.drills[i];const t=listSplit(d.tags);
  const k=t.indexOf(tag);if(k>=0)t.splice(k,1);else t.push(tag);
  d.tags=t.join(", ");renderDrills();
}
function openTagPicker(i,btn){
  closeTagPicker();
  captureEditor();
  const cur=listSplit(EDIT.drills[i].tags);
  const groups={};TAGS.forEach(t=>{(groups[t.category||"Other"]=groups[t.category||"Other"]||[]).push(t.tag);});
  const pop=document.createElement("div");pop.className="tag-pop";pop.id="tag-pop";
  pop.innerHTML=Object.entries(groups).map(([cat,list])=>`<div class="tag-pop-cat">${esc(cat)}</div><div class="tag-pop-list">${list.map(t=>`<button type="button" class="ed-tagopt ${tagClass(t)}${cur.includes(t)?" on":""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>`).join("")+
    `<div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" class="btn btn-primary" onclick="closeTagPicker()">Done</button></div>`;
  pop.addEventListener("click",e=>{
    const b=e.target.closest(".ed-tagopt");if(!b)return;
    b.classList.toggle("on");
    const d=EDIT.drills[i];const t=listSplit(d.tags),tag=b.dataset.t,k=t.indexOf(tag);
    if(k>=0)t.splice(k,1);else t.push(tag);d.tags=t.join(", ");
    pop.dataset.dirty="1";
  });
  btn.closest(".ed-drill-fields").appendChild(pop);
  pop._i=i;
}
function closeTagPicker(){const p=document.getElementById("tag-pop");if(p){const dirty=p.dataset.dirty;p.remove();if(dirty)renderDrills();}}

function renderAvail(){
  document.getElementById("ed-avail").innerHTML=ROSTER.length?ROSTER.map(r=>`
    <div class="ed-av-row"><div class="ed-av-name">${esc(r.player)}</div>${segHtml("av:"+r.player,STATUS_OPTS,EDIT.avail[r.player]||"",false)}</div>`).join("")
    :'<div class="f-hint">No players on the Roster Availability tab.</div>';
}
document.addEventListener("segchange",e=>{
  if(!EDIT)return;
  const n=e.detail.name;
  if(n.startsWith("av:")){EDIT.avail[n.slice(3)]=e.detail.value;renderTeams();}
});
function unavailableShort(){
  return new Set(ROSTER.filter(r=>["X","I","A","S"].includes(EDIT.avail[r.player])).map(r=>shortName(r.player)));
}
function renderTeams(){
  const keys=teamKeys();
  const names=ROSTER.map(r=>shortName(r.player));
  const out=unavailableShort();
  const main=keys.filter(k=>k==="team_5v5_Black"||k==="team_5v5_White");
  const extra=keys.filter(k=>!main.includes(k));
  const block=k=>{
    const val=document.querySelector(`.ed-team-in[data-k="${k}"]`)?.value ?? (EDIT.p[k]||"");
    const inTeam=new Set(listSplit(val).map(x=>x.replace(/['’]/g,"").toLowerCase()));
    const others=new Set(keys.filter(x=>x!==k&&x.slice(0,8)===k.slice(0,8)).flatMap(x=>listSplit(document.querySelector(`.ed-team-in[data-k="${x}"]`)?.value ?? (EDIT.p[x]||"")).map(y=>y.replace(/['’]/g,"").toLowerCase())));
    return `<div class="ed-team">
      <label class="f-lbl">${esc(TEAM_LABELS[k]||k)} <span class="ed-team-count">${listSplit(val).length||""}</span></label>
      <input class="f-in ed-team-in" data-k="${esc(k)}" value="${esc(val)}" placeholder="Names, comma separated" oninput="renderTeams()">
      <div class="ed-chips">${names.map(n=>{const lk=n.toLowerCase();const on=inTeam.has(lk);return `<button type="button" class="ed-chip${on?" on":""}${out.has(n)?" out":""}${!on&&others.has(lk)?" taken":""}" onclick="togglePlayer('${esc(k)}','${esc(n)}')">${esc(n)}</button>`;}).join("")}</div>
    </div>`;
  };
  const focused=document.activeElement&&document.activeElement.classList.contains("ed-team-in")?document.activeElement.dataset.k:null;
  const caret=focused?document.activeElement.selectionStart:null;
  const wasOpen=document.getElementById("ed-more-teams")?.open;
  document.getElementById("ed-teams").innerHTML=main.map(block).join("")+
    (extra.length?`<details id="ed-more-teams"${wasOpen||extra.some(k=>EDIT.p[k])?" open":""}><summary class="f-lbl" style="cursor:pointer;margin:6px 0 10px">More teams (5v5 C, 4v4)</summary>${extra.map(block).join("")}</details>`:"");
  if(focused){const el=document.querySelector(`.ed-team-in[data-k="${focused}"]`);if(el){el.focus();try{el.setSelectionRange(caret,caret);}catch(e){}}}
}
function togglePlayer(k,name){
  const inp=document.querySelector(`.ed-team-in[data-k="${k}"]`);
  const list=listSplit(inp.value);
  const norm=x=>x.replace(/['’]/g,"").toLowerCase();
  const at=list.findIndex(x=>norm(x)===norm(name));
  if(at>=0)list.splice(at,1);else list.push(name);
  inp.value=list.join(", ");
  EDIT.p[k]=inp.value;
  renderTeams();
}

function editError(msg){const e=document.getElementById("ed-err");e.textContent=msg||"";if(msg)e.scrollIntoView({block:"center",behavior:"smooth"});}
async function savePractice(){
  closeTagPicker();
  captureEditor();
  const p=EDIT.p;
  if(!/^\d+$/.test(String(p.practice_num)))return editError("Practice # should be a whole number.");
  if(!p.date)return editError("Pick a date.");
  if(EDIT.isNew&&PRACTICES.some(x=>String(x.practice_num)===String(p.practice_num)))return editError("Practice #"+p.practice_num+" already exists.");
  const drills=EDIT.drills.filter(d=>d.drill);
  const unnamed=EDIT.drills.filter(d=>!d.drill&&(d.focus_note||d.segment||d.minutes)).length;
  if(unnamed)return editError(unnamed+" drill"+(unnamed>1?"s have":" has")+" no drill name — pick one or remove "+(unnamed>1?"them":"it")+".");
  const practice={};
  Object.keys(p).forEach(k=>{if(!k.startsWith("_"))practice[k]=p[k];});
  teamKeys().forEach(k=>{practice[k]=p[k]||"";});
  const body={type:"hub_practice_save",practice,drills,availability:EDIT.avail};
  if(!EDIT.isNew){body.original_num=EDIT.original;body.expect_date=EDIT.expectDate;}
  await writePractice(body,EDIT.isNew?"Practice #"+p.practice_num+" created":"Saved",p.practice_num);
}
async function deletePractice(btn){
  if(!armConfirm(btn,"Tap again — delete practice #"+EDIT.original+" and its drills"))return;
  await writePractice({type:"hub_practice_delete",practice_num:EDIT.original,expect_date:EDIT.expectDate},"Practice #"+EDIT.original+" deleted",null);
}
async function writePractice(body,doneMsg,showNum){
  const btns=document.querySelectorAll("#editor .ed-actions button");
  btns.forEach(b=>b.disabled=true);
  const save=document.getElementById("ed-save"),txt=save.textContent;save.textContent="Saving…";
  editError("");
  try{
    const out=await hubWrite(body);
    if(out.error==="row_moved"){
      editError("This practice was changed in the Google Sheet since you opened it. Cancel, and the page will reload the latest version.");
      try{const fresh=await hubCall({type:"hub_practice_get"});if(fresh.ok)applyLive(fresh);}catch(e){}
      return;
    }
    if(!out.ok)throw new Error(out.error||"Couldn't save");
    applyLive(out);
    EDIT=null;document.body.classList.remove("editing");
    document.getElementById("editor").innerHTML="";
    if(showNum){const i=PRACTICES.findIndex(x=>String(x.practice_num)===String(showNum));if(i>=0)currentIdx=i;}
    else currentIdx=Math.min(currentIdx,PRACTICES.length-1);
    renderPractice();
    window.scrollTo(0,0);
    toast(doneMsg);
  }catch(err){
    editError(String(err.message)==="cancelled"?"Not saved — the edit code is needed to change the sheet.":err.message);
  }finally{
    btns.forEach(b=>b.disabled=false);
    const s=document.getElementById("ed-save");if(s)s.textContent=txt;
  }
}
function cancelEdit(){
  closeTagPicker();
  EDIT=null;document.body.classList.remove("editing");
  document.getElementById("editor").innerHTML="";
  renderPractice();
}
document.addEventListener("click",e=>{
  const pop=document.getElementById("tag-pop");
  if(pop&&!pop.contains(e.target)&&!e.target.closest(".ed-tag-add"))closeTagPicker();
});
window.addEventListener("beforeunload",e=>{if(EDIT){e.preventDefault();e.returnValue="";}});

window.addEventListener("load",()=>{
  const src="data:image/jpeg;base64,"+LOGO;
  document.getElementById("login-logo").src=src;
  document.getElementById("topbar-logo").src=src;
});
</script>
